name: Deploy Feature/Testing to Synology NAS

on:
  push:
    branches: ["feature/tracking_manager"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to Synology NAS for testing"
        required: true
        default: "feature/tracking_manager"

concurrency:
  group: feature-testing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, synology]

    steps:
      - name: Checkout Repository with Auth
        uses: actions/checkout@v4
        with:
          ref: feature/tracking_manager
          clean: false

      - name: Deploy Feature Branch on Synology NAS
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying branch: feature/tracking_manager..."

          mkdir -p backups static/photos

          echo "Purging old usav_* containers..."
          docker compose --profile dev down --remove-orphans || true
          docker rm -f usav_frontend usav_frontend_dev usav_migrations usav_backend_dev usav_db usav_backup || true

          echo "Running database migrations..."
          docker compose --profile migrate up --remove-orphans migrations || true

          echo "Starting testing containers..."
          docker compose --profile dev up -d --remove-orphans

          echo "Cleaning up unused Docker images..."
          docker image prune -f

          echo "Deployment completed successfully!"
