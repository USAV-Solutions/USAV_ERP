name: Deploy Feature/Testing to Synology NAS

on:
  push:
    branches: ["feature/tracking_manager"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to Synology NAS for testing"
        required: true
        default: "feature/tracking_manager"

concurrency:
  group: feature-testing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository with Auth
        uses: actions/checkout@v4
        with:
          ref: feature/tracking_manager

      - name: Deploy Feature Branch on Synology NAS
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying branch: feature/tracking_manager to Synology NAS testing environment..."

          if [ -d "/volume1/docker/USAV_ERP" ]; then
            cd "/volume1/docker/USAV_ERP"
          elif [ -d "/docker/USAV_ERP" ]; then
            cd "/docker/USAV_ERP"
          fi

          echo "Purging old usav_* containers..."
          docker compose --profile dev down --remove-orphans || true
          docker rm -f eb8236e10bb1513aa327e307c49cf5952a3c02b97474e90f0b8cabf99ee1b1be usav_frontend usav_frontend_dev usav_migrations usav_backend_dev usav_db usav_backup || true

          echo "Running database migrations..."
          docker compose --profile migrate up --remove-orphans migrations || true

          echo "Starting testing containers..."
          docker compose --profile dev up -d --remove-orphans

          echo "Cleaning up unused Docker images..."
          docker image prune -f
          docker image prune -f

          echo "Deployment completed successfully!"
