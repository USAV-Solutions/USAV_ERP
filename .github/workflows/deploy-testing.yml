name: Deploy Feature/Testing to Synology NAS

on:
  push:
    branches: ["feature/tracking_manager"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to Synology NAS for testing"
        required: true
        default: "feature/tracking_manager"

concurrency:
  group: feature-testing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy Feature Branch on Synology NAS
        shell: bash
        run: |
          set -euo pipefail

          TARGET_BRANCH="feature/tracking_manager"
          echo "Deploying branch: ${TARGET_BRANCH} to Synology NAS testing environment..."

          # Navigate to workspace directory on Synology NAS
          if [ -d "/volume1/docker/USAV_ERP" ]; then
            cd "/volume1/docker/USAV_ERP"
          elif [ -d "/docker/USAV_ERP" ]; then
            cd "/docker/USAV_ERP"
          elif [ -d "$HOME/USAV_Inventory" ]; then
            cd "$HOME/USAV_Inventory"
          else
            echo "Error: USAV ERP directory not found on NAS host."
            exit 1
          fi

          git config --global --add safe.directory '*' || true

          echo "Fetching latest code for ${TARGET_BRANCH}..."
          git fetch origin "${TARGET_BRANCH}"
          git checkout "${TARGET_BRANCH}"
          git reset --hard "origin/${TARGET_BRANCH}"

          echo "Running database migrations..."
          docker compose --profile migrate up --build --remove-orphans migrations || true

          echo "Building and restarting testing containers..."
          docker compose --profile dev up -d --build --remove-orphans

          echo "Cleaning up unused Docker images..."
          docker image prune -f

          echo "Deployment of ${TARGET_BRANCH} to Synology NAS completed successfully!"
