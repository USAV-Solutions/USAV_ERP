name: Deploy Feature/Testing to Synology NAS

on:
  push:
    branches: ["feature/tracking_manager"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to Synology NAS for testing"
        required: true
        default: "feature/tracking_manager"

concurrency:
  group: feature-testing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository with Auth
        uses: actions/checkout@v4
        with:
          ref: feature/tracking_manager

      - name: Deploy Feature Branch on Synology NAS
        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying branch: feature/tracking_manager to Synology NAS testing environment..."

          if [ -d "/volume1/docker/USAV_ERP" ]; then
            cd "/volume1/docker/USAV_ERP"
          elif [ -d "/docker/USAV_ERP" ]; then
            cd "/docker/USAV_ERP"
          fi

          echo "Cleaning old conflicting containers..."
          docker compose --profile dev down -v --remove-orphans || true
          docker ps -a --filter "name=usav_" -q | xargs -r docker rm -f || true
          docker rm -f usav_db usav_backend usav_backend_dev usav_frontend usav_frontend_dev usav_migrations a8c16b9152a80cff04c9f25e304a30a5d318815f7533e4ceb52d39b35eb535dd || true

          echo "Running database migrations..."
          docker compose --profile migrate up --build --remove-orphans migrations || true

          echo "Building and restarting testing containers..."
          docker compose --profile dev up -d --build --remove-orphans

          echo "Cleaning up unused Docker images..."
          docker image prune -f

          echo "Deployment completed successfully!"
