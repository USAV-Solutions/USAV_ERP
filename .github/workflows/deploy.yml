name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: production

    steps:
      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail

          cd ~/USAV_Inventory

          echo "Fixing file permissions if altered by containers..."
          (echo 1 | sudo -S rm -rf backups 2>/dev/null) || sudo rm -rf backups 2>/dev/null || rm -rf backups 2>/dev/null || true
          (echo 1 | sudo -S chown -R $(id -u):$(id -g) . 2>/dev/null) || sudo chown -R $(id -u):$(id -g) . 2>/dev/null || true

          echo "Fetching latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "Running migrations..."
          docker compose --profile migrate up --build --remove-orphans migrations

          echo "Restarting production containers..."
          docker compose --profile prod up -d --build --remove-orphans

          echo "Cleaning unused Docker images..."
          docker image prune -f